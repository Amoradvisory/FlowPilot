name: Verify and deploy TeacherFlow to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacherflow-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Check TeacherFlow formatting
        run: npm run lint:teacherflow

      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Install critical Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run critical browser tests
        run: npm run test:e2e -- --project=chromium --project=webkit

      - name: Upload the verified Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v4
