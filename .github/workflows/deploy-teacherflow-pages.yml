name: Deploy TeacherFlow to GitHub Pages

on:
  push:
    branches:
      - teacherflow-demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: teacherflow-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TeacherFlow behavior tests
        run: node --test src/lib/teacherflow-demo.test.ts

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Build for the project site
        env:
          BASE_PATH: /FlowPilot
        run: npm run build

      - name: Add the single-page-app fallback
        run: cp build/index.html build/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
